[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-module-tool-ios-inspector"
version = "0.1.0"
description = "iOS Simulator/device inspection and interaction tool for Amplifier -- selector-first axe/simctl driving, plus read-only physical-device sensing via libimobiledevice/pymobiledevice3"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.entry-points."amplifier.modules"]
tool-ios-inspector = "amplifier_module_tool_ios_inspector:mount"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_ios_inspector"]
